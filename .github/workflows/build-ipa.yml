name: Compilar IPA de Justicia

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Justicia/**'
      - 'Justicia.xcodeproj/**'
      - 'Verificacion/**'
      - '.github/workflows/build-ipa.yml'
      - 'Justicia-iOS.zip'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE"
          archive="$GITHUB_WORKSPACE/Justicia-iOS.zip"
          if [[ -f "$archive" ]]; then
            project_root="$RUNNER_TEMP/justicia-source"
            mkdir -p "$project_root"
            ditto -x -k "$archive" "$project_root"
          fi
          test -f "$project_root/Justicia.xcodeproj/project.pbxproj"
          printf 'JUSTICIA_PROJECT_ROOT=%s\n' "$project_root" >> "$GITHUB_ENV"

      - name: Verificar el flujo de expedientes
        shell: bash
        run: |
          set -euo pipefail
          cd "$JUSTICIA_PROJECT_ROOT"
          swiftc Justicia/Modelo.swift Verificacion/main.swift -o "$RUNNER_TEMP/justicia-test"
          "$RUNNER_TEMP/justicia-test"

      - name: Compilar para iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild \
            -project "$JUSTICIA_PROJECT_ROOT/Justicia.xcodeproj" \
            -target Justicia -configuration Release -sdk iphoneos \
            "SYMROOT=$RUNNER_TEMP/justicia-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Empaquetar IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/justicia-build/Release-iphoneos/Justicia.app"
          test -x "$app/Justicia"
          test -f "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/artifacts"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Justicia.app"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/artifacts/Justicia.ipa" Payload
          )
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/artifacts/Justicia.ipa"

      - name: Publicar IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Justicia-iOS
          path: artifacts/Justicia.ipa
          if-no-files-found: error
